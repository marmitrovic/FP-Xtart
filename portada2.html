<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		body{
			background-color: bisque;

		}
		@keyframes animation{
			from {
				margin-top: 90px;
				color: rgba(255, 255, 255, 0);
			}
			to {
				color: rgba(164, 50, 50, 0.905);
			}
		}
		.mensaje{
			color: rgba(164, 50, 50, 0.905);
			text-align: center;
			
			background-color: rgb(255, 208, 0);
			margin-top: 100px;
			animation-name: animation;
			animation-duration: 2s;
		}
	</style>
</head>
<body>
	<div class="mensaje">WELCOME A LA WEB DE MARKO</div>
</body>
</html>
