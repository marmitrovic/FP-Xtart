<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Galery</title>
	<style>
		.image{
			width: 200px;
			height: 200px;
			margin: 10px;
			border-radius: 5px;
			opacity: 0.8;
			/*mas control en el transition*/
			transition: opacity 1s, transform 0.25s;
		}
		.image:hover{
			transform: scale(1.1);
			opacity: 1;
		}
	</style>
</head>
<body>
	<div>Ejemplos con imagenes</div>
	<!-- la siguiente imagen tiene una ruta local en este caso.... -->
	<img class="image" src="imagen1.jpg" alt="">
	<img class="image" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ0GANgYs31Td498jXfqCcfG9n-de2K4zJ5gHzTmzh1aLwOhhXGQPtYq8iV&s=10" alt="">
</body>
</html>
